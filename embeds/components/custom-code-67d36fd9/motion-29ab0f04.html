<style>
  /* Motion tokens: the only place a duration or easing is defined. */
  :root {
    --motion-fast: 160ms;
    --motion-base: 240ms;
    --motion-slow: 500ms;
    --motion-rise: 0.75rem;
    --motion-entry: 320ms;
    --motion-feature: 640ms;
    --motion-step: 80ms;
    /* Pistachio's own curve, from the current site's buttons. */
    --ease-out: cubic-bezier(0, 0.6, 0.5, 1);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }

  [data-reveal] {
    --reveal-duration: var(--motion-entry);
    --reveal-from: translateY(0.5rem);
    --reveal-ease: var(--ease-out);
    --reveal-opacity: 0;
  }

  [data-reveal="hero"],
  .cta[data-wf--blocks-cta-band--variant="split"] {
    --reveal-duration: var(--motion-feature);
    --reveal-ease: var(--ease-out-expo);
  }

  [data-reveal="hero"] [data-reveal-step="media"] {
    --reveal-from: translateY(1rem) scale(0.97);
  }

  /* Keep the first screen readable even if the bundle arrives after the first paint. */
  [data-reveal="hero"] { --reveal-opacity: 0.7; }

  .cta[data-wf--blocks-cta-band--variant="split"] .cta_content {
    --reveal-duration: var(--motion-entry);
  }

  .cta[data-wf--blocks-cta-band--variant="split"] .cta_media {
    --reveal-from: translateY(0.75rem) rotate(-1.5deg) scale(0.985);
  }

  /* A card responds as one: the photograph and link arrow move together. */
  .product-card_image {
    transition: transform var(--motion-slow) var(--ease-out-expo);
  }

  @media (hover: hover) and (pointer: fine) {
    .product-card:hover .product-card_image { transform: scale(1.035); }
    .product-card:hover .arrow { background-color: var(--arrow-hover-bg); color: var(--arrow-hover-fg); }
    .product-card:hover .arrow_icon { transform: translateX(100%); }
  }

  .product-card:focus-within .product-card_image { transform: scale(1.035); }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
