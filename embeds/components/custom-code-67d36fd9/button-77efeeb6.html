<style>
  /* Button: the fill deepens a step on hover (Designer, with the transitions). Its arrow is a
     Core / Arrow, whose variant (set per button) picks the circle colours and slides on hover. */
  .button:active {
    transform: scale(0.98);
  }

  /* Download: the arrow points, and slides, down. */
  [data-wf--core-button--variant="download"] .arrow {
    rotate: 90deg;
  }

  @media (max-width: 767px) {
    .button:has(> .button_text-mobile:not(:empty)) > .button_text { display: none; }
    .button > .button_text-mobile:not(:empty) { display: block; }
  }
</style>
